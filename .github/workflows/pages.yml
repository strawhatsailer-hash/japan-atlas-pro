name: Build and deploy Japan Atlas Pro

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      retry_missing_photos:
        description: 'Retry destinations without bundled photos'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Prepare site files
        run: |
          mkdir -p dist
          cp index.html manifest.webmanifest icon.svg sw.js dist/
          cp places.json dist/
      - name: Download and bundle reusable Wikimedia Commons photos
        run: python scripts/download_photos.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
